name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu image already provides Android SDK tools and licenses.
      # Install only the platform/build tools needed by this project.
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      # §12 zero-network guarantee: fail the build on INTERNET in the merged manifest
      - name: Check privacy manifest
        run: python3 scripts/verify_manifest.py
